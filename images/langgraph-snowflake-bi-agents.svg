<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#26344f"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bbcf6"/>
      <stop offset="1" stop-color="#7056d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080d17" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <circle cx="720" cy="65" r="110" fill="#29b5e8" opacity=".08"/>
  <circle cx="90" cy="390" r="130" fill="#8b79d8" opacity=".09"/>

  <text x="48" y="58" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">LangGraph Multi-Agent Analytics</text>
  <text x="48" y="86" fill="#aebbd1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Plain-English questions → governed insights → dashboards</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="150" width="175" height="82" rx="16" fill="#f8fafc"/>
    <rect x="48" y="150" width="175" height="82" rx="16" fill="none" stroke="#d8e2f0" stroke-width="2"/>
    <circle cx="82" cy="191" r="20" fill="url(#node)"/>
    <path d="M82 177v28M68 191h28M74 183l16 16M90 183l-16 16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="112" y="186" fill="#182033" font-size="16" font-weight="700">Analyst</text>
    <text x="112" y="209" fill="#65728a" font-size="13">writes &amp; runs SQL</text>

    <rect x="313" y="150" width="175" height="82" rx="16" fill="#f8fafc"/>
    <rect x="313" y="150" width="175" height="82" rx="16" fill="none" stroke="#d8e2f0" stroke-width="2"/>
    <circle cx="347" cy="191" r="20" fill="url(#node)"/>
    <path d="M337 201h20v-20h-20zm5-5h10m-10-5h10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="377" y="186" fill="#182033" font-size="16" font-weight="700">BI Agent</text>
    <text x="377" y="209" fill="#65728a" font-size="13">builds dashboard</text>

    <rect x="578" y="150" width="174" height="82" rx="16" fill="#f8fafc"/>
    <rect x="578" y="150" width="174" height="82" rx="16" fill="none" stroke="#d8e2f0" stroke-width="2"/>
    <circle cx="612" cy="191" r="20" fill="url(#node)"/>
    <path d="M602 182h20M602 191h20M602 200h12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="642" y="186" fill="#182033" font-size="16" font-weight="700">Summary</text>
    <text x="642" y="209" fill="#65728a" font-size="13">explains results</text>
  </g>

  <g fill="none" stroke="#7fd3fb" stroke-width="4" stroke-linecap="round">
    <path d="M223 191h90"/>
    <path d="m299 181 14 10-14 10"/>
    <path d="M488 191h90"/>
    <path d="m564 181 14 10-14 10"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="302" width="260" height="94" rx="18" fill="#29b5e8"/>
    <path d="M400 319l50 23-50 23-50-23z" fill="#dff7ff" opacity=".95"/>
    <path d="M350 342v21l50 24 50-24v-21" fill="#bceaff" opacity=".8"/>
    <path d="M400 342v45" stroke="#29b5e8" stroke-width="3"/>
    <text x="400" y="386" text-anchor="middle" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SNOWFLAKE</text>
  </g>

  <path d="M400 232v70" fill="none" stroke="#7fd3fb" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="400" cy="253" r="6" fill="#7fd3fb"/>
</svg>
